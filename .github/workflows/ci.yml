name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go test ./internal/core ./internal/tools ./internal/tui/... -count=10
      - run: bash scripts/checkdeps.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: deadcode
        run: go run golang.org/x/tools/cmd/deadcode@v0.53.0 -test ./...

  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: go build ./...
      - name: binary e2e (real process + HTTP model stub)
        run: go test ./e2e -v -count=1
        env:
          HB_E2E: '1'
      - name: dependency direction
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/checkdeps.ps1

  govuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
