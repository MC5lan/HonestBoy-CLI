version: 2
project_name: hb
before:
  hooks:
    - go mod tidy
builds:
  - id: hb
    main: ./cmd/hb
    binary: hb
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/MC5lan/HonestBoy-CLI/internal/cli.Version={{.Version}}
      - -X github.com/MC5lan/HonestBoy-CLI/internal/cli.Commit={{.Commit}}
      - -X github.com/MC5lan/HonestBoy-CLI/internal/cli.Date={{.Date}}
    goos: [windows, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: arm64
archives:
  - id: hb
    formats: [zip]
    name_template: "hb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
release:
  github:
    owner: MC5lan
    name: HonestBoy-CLI
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
